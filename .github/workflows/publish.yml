# On every push to main, release-please opens or updates a release pull
# request from the conventional commits since the last release. Merging that
# pull request tags the release, and the publish job then uploads it to PyPI.
#
# PyPI trusted publishing (no API token) is tied to this file's name and the
# `pypi` environment, so both must match the publisher configured on PyPI.
# The publish job lives here, not in its own workflow, because a release made
# with the built-in token does not trigger other workflows.
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

      # release-please bumps the version in pyproject.toml but not in uv.lock,
      # and `uv sync --locked` fails when they differ. Re-lock on the release
      # branch whenever it exists and is out of date.
      - name: Find the release branch
        id: branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(gh api "repos/${{ github.repository }}/pulls?state=open&per_page=100" \
            --jq '[.[] | select(.head.ref | startswith("release-please--branches--main"))][0].head.ref // empty')
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.branch.outputs.name != ''
        with:
          ref: ${{ steps.branch.outputs.name }}
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.branch.outputs.name != ''
      - name: Update uv.lock on the release branch
        if: steps.branch.outputs.name != ''
        run: |
          uv lock
          if ! git diff --quiet uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: update uv.lock for release" uv.lock
            git push
          fi

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # The interface is built into src/talkviz/web, which the wheel includes.
      - run: npm ci && npm run build
        working-directory: frontend
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - name: Check the wheel contains the interface
        run: unzip -l dist/*.whl | grep -q "talkviz/web/index.html"
      - uses: pypa/gh-action-pypi-publish@release/v1
