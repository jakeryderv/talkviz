# On every push to main, release-please opens or updates a release pull
# request from the conventional commits since the last release. Merging that
# pull request tags the release, and the publish job then uploads it to PyPI.
#
# PyPI trusted publishing (no API token) is tied to this file's name and the
# `pypi` environment, so both must match the publisher configured on PyPI.
# The publish job lives here, not in its own workflow, because a release made
# with the built-in token does not trigger other workflows.
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
